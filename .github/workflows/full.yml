name: Full suite

# Slow release suite: terminal end-to-end, packages, race detector, native arm64.
# Runs nightly, on release tags, and on demand (Actions tab or `gh workflow run full.yml`;
# add `-f suites='["test-terminal"]'` to run a subset).
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'JSON list of make targets to run'
        default: '["check-core", "test-terminal", "test-terminal-packages", "test-race-core"]'
  schedule:
    - cron: '17 6 * * *'
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.suite }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        suite: ${{ fromJSON(inputs.suites || '["check-core", "test-terminal", "test-terminal-packages", "test-race-core"]') }}
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make ${{ matrix.suite }}
